  -->
  <rect width="128" height="128" rx="30" fill="#161618"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M72 28 H44 A16 16 0 0 0 28 44 V84 A16 16 0 0 0 44 100 H84 A16 16 0 0 0 100 84 V56" stroke="#f5f5f3" stroke-width="8"/>
